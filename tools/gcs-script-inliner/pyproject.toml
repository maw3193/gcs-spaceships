[project]
name = "gcs-script-inliner"
version = "0.1.0"
description = "Inserts scripts from a .js file into their place in gcs files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-yaml>=1.6.0",
    "ruff>=0.15.14",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "ty>=0.0.39",
]
